name: Assemble Soft Open b64
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/assemble-soft-open-b64.yml"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Soft Open invite PNG base64 sources
        run: |
          set -euo pipefail
          mkdir -p public/convite
          curl -fsSL -o public/convite/inauguracao-quadrado.png.b64 https://litter.catbox.moe/87mifu.b64
          curl -fsSL -o public/convite/inauguracao-paisagem.png.b64 https://litter.catbox.moe/p90alx.b64
          curl -fsSL -o public/convite/inauguracao-story.png.b64 https://litter.catbox.moe/c4yjw0.b64
          test "$(wc -c < public/convite/inauguracao-quadrado.png.b64)" -eq 162901
          test "$(wc -c < public/convite/inauguracao-paisagem.png.b64)" -eq 170089
          test "$(wc -c < public/convite/inauguracao-story.png.b64)" -eq 242337
          python3 - <<'PY'
          import base64, pathlib
          for name, n in [
              ("inauguracao-quadrado", 122173),
              ("inauguracao-paisagem", 127566),
              ("inauguracao-story", 181750),
          ]:
              raw = pathlib.Path(f"public/convite/{name}.png.b64").read_text().replace("\n", "").replace("\r", "")
              data = base64.b64decode(raw)
              assert len(data) == n, (name, len(data), n)
              assert data[:8] == b"\x89PNG\r\n\x1a\n", name
          print("b64 decode checks ok")
          PY
      - name: Commit base64 sources
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/convite/inauguracao-quadrado.png.b64 public/convite/inauguracao-paisagem.png.b64 public/convite/inauguracao-story.png.b64
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add Soft Open invite PNG base64 sources for build decode."
          git push
